server:
  port: 8081

spring:
  application:
    name: notification-api
  datasource:
    url: jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Dev/assignment-only in-memory DB sharing -- see H2TcpServerConfig.
notification:
  h2-server:
    enabled: true
    tcp-port: 9092
