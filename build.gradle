plugins {
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

ext {
    springBootVersion = '3.3.5'
}

allprojects {
    group = 'com.meetbhavesh.notification'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // Import the Spring Boot BOM explicitly here (rather than relying on the
    // spring-boot Gradle plugin's implicit auto-import) because not every
    // subproject applies that plugin -- notification-domain is a plain
    // java-library, not a bootable app, but it still needs managed versions
    // for spring-boot-starter-data-jpa and lombok.
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
